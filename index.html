<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <title>Adios</title>
  <meta name="description" content="As our college repeatedly tried to take down my website, I've decided to make this project private. Thank You."/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.ico"/>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <link rel="manifest" href="manifest.json"/>

  <!-- Mobile PWA & Status Bar Styling -->
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Adios"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>

  <!-- Typography: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="maintenance-screen" id="maintenanceScreen" role="main">
    <div class="maintenance-card">
      <h1 class="maintenance-title" id="maintenanceTitle">Adios</h1>
      <p class="maintenance-body" id="maintenanceBody">
        As our college repeatedly tried to take down my website, I've decided to make this project private.
      </p>
      <div class="maintenance-divider" aria-hidden="true"></div>
      <p class="maintenance-closing" id="maintenanceClosing">Thank You</p>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
